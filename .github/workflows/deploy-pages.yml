name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manually triggering a deployment from the Actions tab.
  workflow_dispatch:

# Allow one concurrent deployment; skip runs queued behind an already-running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate data/collections.json
        run: node scripts/validate-data.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # This repo has never had Pages enabled via the dashboard —
          # enablement: true lets this action turn it on itself (source:
          # GitHub Actions) on first run instead of failing with "Get
          # Pages site failed... verify that the repository has Pages
          # enabled." Safe to leave true permanently: once enabled, this
          # is a no-op on every subsequent run.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # This is a plain static site (no build step) — publish the repo root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
